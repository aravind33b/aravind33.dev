name: Auto pre-prod merge
on:
    push:
        branches-ignore:
            - main
            - pre-prod
permissions:
  contents: write
  pull-requests: write
jobs:
    pre-prod-merge:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
            - name: Authenticate GitHub CLI
              run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
            - name: Merge current branch into pre-prod
              env:
                GH_TOKEN: ${{ github.token }}
                SRC_BRANCH: ${{ github.ref_name }}
              run: |
                # true here is used to make sure that even if I make a change and push again from the same branch, it should get merged without throwing error
                gh pr create --base pre-prod --head "$SRC_BRANCH" --title "Auto-merge $SRC_BRANCH into pre-prod" --body "Automated merge for $SRC_BRANCH into pre-prod" || true
                gh pr merge "$SRC_BRANCH" --merge --auto --delete-branch=false
            - name: Integration Test
              run: |
                git config user.name "GitHub Actions"
                git config user.email "actions@github.com"
                
                echo "Pulling latest pre-prod to verify integration"
                git pull origin pre-prod --no-rebase

                echo "Running tests"
                # npm install && npm test
            - name: Create a PR from feature branch to main
              env:
                GH_TOKEN: ${{ github.token }}
                SRC_BRANCH: ${{ github.ref_name }}
              run: |
                git fetch origin
                git checkout pre-prod
                git merge --no-ff "origin/${SRC_BRANCH}" -m "Auto-merge ${SRC_BRANCH} into pre-prod"
            - name: Push pre-prod to origin
              run: |
                git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
                git push origin pre-prod
